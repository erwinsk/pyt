name: build-windows

on:
  push:
    branches: [main]
    paths:
      - "modbus_tool_v18/**"
      - ".github/workflows/python-app.yml"
    tags: ["modbus-v*"]   # push tag modbus-vX.Y -> build + buat draf Release
  workflow_dispatch:   # supaya bisa dijalankan manual dari tombol
    inputs:
      lewati_tes:
        description: "Lewati pytest sebelum build"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: modbus_tool_v18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            modbus_tool_v18/requirements.txt
            modbus_tool_v18/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Jalankan tes
        if: ${{ !inputs.lewati_tes }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest

      # Mode folder (bukan --onefile): lebih jarang ditandai antivirus / Smart App Control.
      # build.py membuat dist/ModbusToolsKalingin_v<versi>_win64.zip dan mencetak SHA-256.
      - name: Build (PyInstaller via build.py)
        run: python build.py

      - name: Lihat isi dist
        run: Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: ModbusToolsKalingin-v18-windows
          path: modbus_tool_v18/dist/*.zip
          if-no-files-found: error

  # Hanya jalan bila workflow dipicu oleh tag "modbus-v*" (atau dijalankan manual di tag itu).
  # Hasilnya DRAF Release: periksa dan edit catatannya di GitHub, lalu tekan Publish.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/modbus-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ModbusToolsKalingin-v18-windows
          path: dist

      - name: Buat draf Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" dist/*
          --repo "${{ github.repository }}"
          --title "Modbus Tools Kalingin ${{ github.ref_name }}"
          --generate-notes --draft
