name: build-pdf-tools

on:
  push:
    branches: [main]
    paths:
      - "pdf_tools/**"
      - ".github/workflows/build-pdf-tools.yml"
    tags: ["pdf-v*"]   # push tag pdf-vX.Y -> build + buat draf Release
  workflow_dispatch:   # supaya bisa dijalankan manual dari tombol

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pdf_tools
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pdf_tools/pdf_suite/requirements.txt

      # Hanya dependensi wajib (PyQt5, PyMuPDF, Pillow, platformdirs). Alat opsional
      # (ocrmypdf, archive-pdf-tools) dan alat eksternal (Ghostscript, Tesseract, jbig2enc, dst.)
      # TIDAK dibundel; di komputer pengguna diisi lewat dialog "Dependensi dan cache" di aplikasi.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller -r pdf_suite/requirements.txt

      # Memakai PDF_Tools_Suite.spec (sumber tunggal pengaturan build: entry point, ikon, hidden import).
      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean PDF_Tools_Suite.spec

      - name: Lihat isi dist dan hash
        run: |
          Get-ChildItem dist
          Get-FileHash dist\PDF_Tools_Suite.exe -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: PDF_Tools_Suite-windows
          path: pdf_tools/dist/PDF_Tools_Suite.exe
          if-no-files-found: error

  # Hanya jalan bila workflow dipicu oleh tag "pdf-v*" (atau dijalankan manual di tag itu).
  # Hasilnya DRAF Release: periksa dan edit catatannya di GitHub, lalu tekan Publish.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/pdf-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PDF_Tools_Suite-windows
          path: dist

      - name: Buat draf Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" dist/*
          --repo "${{ github.repository }}"
          --title "PDF Tools Suite ${{ github.ref_name }}"
          --generate-notes --draft
